name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      # Pelo celular só dá para enviar o .zip: se o projeto ainda não estiver
      # solto no repositório, ele é extraído aqui. Se já estiver, este passo não faz nada.
      - name: Extrair o projeto do ZIP (se necessário)
        run: |
          if [ ! -f settings.gradle.kts ]; then
            for z in ./*.zip; do
              [ -f "$z" ] || continue
              unzip -q -o "$z"
            done
          fi
          test -f settings.gradle.kts || { echo "settings.gradle.kts não encontrado: envie o ZIP do projeto na raiz do repositório."; exit 1; }

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar o Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Rodar os testes unitários
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compilar o APK de depuração
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Conferir o APK gerado
        run: |
          ls -l app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar relatórios de teste (se algo falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: app/build/reports/
          if-no-files-found: ignore
